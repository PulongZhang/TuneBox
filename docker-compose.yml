services:
  tunebox:
    # GitHub Actions 自动构建并推送的镜像（ghcr.io），VPS 直接拉取
    image: ghcr.io/pulongzhang/tunebox:latest
    # 只绑定宿主机回环地址——公网访问经宿主机上的 cloudflared 隧道/反向代理
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      # 网易云登录态持久化到数据卷（容器重建不丢失）
      - NETEASE_COOKIE_FILE=/data/netease_cookie.json
    volumes:
      - tunebox-data:/data
    restart: unless-stopped

volumes:
  tunebox-data:
