name: Build Docker image

on:
  # 仅手动触发（避免每次 push 都打镜像）；版本号从 FastAPI 代码中自动读取
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from FastAPI
        id: ver
        run: |
          VERSION=$(grep -oP 'version="\K[0-9.]+' backend/app/__init__.py)
          echo "FastAPI version: $VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # 只推纯 amd64 manifest（无 index/证明子清单）：
          # provenance 清单会让 ghcr 把同一 digest 的子清单算作旧版本，
          # 清理时被删掉后新 index 仍引用它，导致拉取 404。
          platforms: linux/amd64
          provenance: false
          # latest 作为可滚动指针；版本号 tag 动态取自 backend/app/__init__.py
          tags: |
            ghcr.io/pulongzhang/tunebox:latest
            ghcr.io/pulongzhang/tunebox:${{ steps.ver.outputs.tag }}

      - name: Prune old versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: tunebox
          package-type: container
          # 只保留最近 3 个版本，更早的自动删除
          min-versions-to-keep: 3
