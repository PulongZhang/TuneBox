name: Build Docker image

on:
  # 仅手动触发（避免每次 push 都打镜像）；构建时输入版本号
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号，例如 v1.0.1'
        required: true
        default: 'v0.1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # latest 作为可滚动指针；版本号 tag 作为具体发布标识
          tags: |
            ghcr.io/pulongzhang/tunebox:latest
            ghcr.io/pulongzhang/tunebox:${{ inputs.version }}

      - name: Prune old versions
        uses: ghcr.io/actions/delete-package-versions@v5
        with:
          package-name: tunebox
          package-type: container
          # 只保留最近 3 个版本，更早的自动删除
          min-versions-to-keep: 3
